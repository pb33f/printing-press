title: Train Travel API Catalog
description: Example multi-spec API catalog for train travel services.
output: ./api-docs
publish: true

scan:
  root: ./services
  include:
    - "**/*.yaml"

grouping:
  noiseSegments:
    - services
  serviceIdentity:
    metadataPointers:
      - /info/x-owner/service
    preferOpenAPISlug: true
  contractRoles:
    - pattern: "**/openapi.yaml"
      role: http-api
      contractID: http-api
      default: true
    - pattern: "**/admin.yaml"
      role: http-api
      contractID: admin-api
    - pattern: "**/events/published/**"
      role: published-events
      contractID: published-events
    - pattern: "**/events/consumed/**"
      role: consumed-events
      contractID: consumed-events
  displayNameOverrides:
    - pattern: "stations/**"
      value: Stations API
    - pattern: "trips/**"
      value: Trips API
    - pattern: "bookings/events/published/**"
      value: Bookings Published Events
    - pattern: "bookings/events/consumed/**"
      value: Bookings Consumed Events
    - pattern: "bookings/**"
      value: Bookings API
    - pattern: "payments/**"
      value: Payments API

build:
  mode: full
  maxPools: 3
  workersPerPool: 1

footer:
  enabled: true
  url: https://pb33f.io/printing-press/
  linkTitle: Printing Press
  content: Generated with Printing Press.
